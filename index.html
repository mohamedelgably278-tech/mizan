<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ميزان — نظام تشغيل المطعم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--ring:0 0 0 3px rgba(48,26,91,.22);--shadow:0 1px 2px rgba(48,26,91,.04),0 4px 16px rgba(48,26,91,.05);--ink:#262626;--muted:#5E5868;--bg:#F2F2F2;--card:#FFFFFF;--line:#E2DFE8;--soft:#F5F3F8;--green:#301A5B;--mint:#FFCC33;--dark:#301A5B;--warn:#AC0019;--warnbg:#FCE6E8;--okbg:#EEE9F7;--amber:#F2A20C;--amberbg:#FFF3D6}
*{box-sizing:border-box}
body{margin:0;font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;-webkit-font-smoothing:antialiased}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--green)!important;box-shadow:var(--ring)}
button:focus-visible,a:focus-visible{outline:none;box-shadow:var(--ring)}
button,input,select,textarea{font-family:inherit;font-size:15px}
button{cursor:pointer}
a{color:var(--green)}
header.top{background:var(--dark);color:#F7F5FB;padding:10px 20px;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;position:sticky;top:0;z-index:5}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;font-size:20px}
.brand small{font-weight:400;font-size:13px;color:#D9D2EA}
nav.tabs{display:flex;flex-wrap:wrap;gap:4px}
nav.tabs button{background:transparent;color:#D9D2EA;border:0;padding:9px 14px;border-radius:9px;min-height:42px}
nav.tabs button.on{background:var(--mint);color:var(--dark);font-weight:600}
nav.tabs .badge{display:inline-block;min-width:20px;padding:0 6px;border-radius:999px;background:var(--warn);color:#fff;font-size:12px;margin-inline-start:6px}
main{max-width:1360px;margin:0 auto;padding:20px}
.card{background:var(--card);border-radius:16px;padding:20px;border:1px solid #E5E1EC;box-shadow:var(--shadow)}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kpi span{color:var(--muted);font-size:13px}
.kpi b{display:block;font-size:26px;margin-top:4px}
.kpi.dark{background:var(--dark);color:#F7F5FB}.kpi.dark span{color:#D9D2EA}.kpi.dark b{color:var(--mint)}
h1{font-size:24px;margin:0 0 4px}h2{font-size:18px;margin:0 0 12px}
.muted{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-start}
.col{flex:1 1 320px;min-width:0}
.col2{flex:2 1 520px;min-width:0}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:0;background:var(--green);color:#fff;font-weight:600;transition:background .15s,transform .05s}
.btn:hover{background:#1E1038}.btn:active{transform:translateY(1px)}
.btn.ghost:hover{background:var(--soft)}
.btn.hot{background:#FFCC33;color:#301A5B}.btn.hot:hover{background:#F2A20C}
.btn.lg.hot{font-weight:700}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid #D4CFDD}
.btn.dark{background:var(--dark)}
.btn.warn{background:var(--warn)}
.btn.sm{min-height:36px;padding:0 12px;font-size:14px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{border:1px solid #D4CFDD;background:#fff;border-radius:999px;padding:6px 14px;min-height:38px}
.chip.on{background:var(--dark);color:#fff;border-color:var(--dark)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.item{border:1px solid var(--line);background:#fff;border-radius:14px;padding:12px;min-height:96px;display:flex;flex-direction:column;justify-content:space-between;text-align:right}
.item b{font-size:15px}.item span{color:var(--green);font-weight:700}
.item.low{border-color:#F3A7AE}
table{width:100%;border-collapse:collapse}
th{color:var(--muted);font-weight:600;text-align:right;font-size:13px;padding:8px;border-bottom:1px solid var(--line)}
td{padding:9px 8px;border-bottom:1px solid #F2F2F2;vertical-align:middle}
.scroll{overflow-x:auto}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px}
.pill.ok{background:var(--okbg);color:var(--green)}.pill.bad{background:var(--warnbg);color:var(--warn)}.pill.mid{background:var(--amberbg);color:#8A5A07}.pill.n{background:var(--soft);color:var(--muted)}
.alert{display:flex;gap:10px;padding:12px;border-radius:12px;background:var(--soft);margin-bottom:8px;font-size:14px;line-height:1.7}
.alert.bad{background:var(--warnbg)}.alert.ok{background:var(--okbg)}
.cartline{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid #F2F2F2}
.cartline .n{flex:1}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:32px;height:32px;border-radius:8px;border:1px solid #D4CFDD;background:#fff}
.total{display:flex;justify-content:space-between;font-size:20px;font-weight:700;margin:12px 0}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);flex:1 1 160px}
label.f input,label.f select,label.f textarea{min-height:42px;border:1px solid #D4CFDD;border-radius:10px;padding:8px 10px;color:var(--ink);background:#fff}
.form{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}

.tickets{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ticket{background:#2A1850;color:#F7F5FB;border-radius:14px;overflow:hidden;border-top:6px solid var(--mint)}
.ticket.late{border-top-color:#FF4900}
.ticket .hd{display:flex;justify-content:space-between;padding:10px 12px;background:#35205F}
.ticket ul{margin:0;padding:10px 26px 10px 12px;line-height:1.9}
.ticket .ft{padding:0 12px 12px}
.kitchen{background:#1E1038;border-radius:16px;padding:16px;min-height:60vh}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:12px 18px;border-radius:12px;z-index:20;font-weight:600;box-shadow:0 6px 24px rgba(0,0,0,.2)}
.modal{position:fixed;inset:0;background:rgba(48,26,91,.55);display:flex;align-items:center;justify-content:center;z-index:15;padding:16px}
.modal .card{max-width:520px;width:100%;max-height:90vh;overflow:auto}
.chat{display:flex;flex-direction:column;gap:8px;max-height:340px;overflow:auto;padding:4px}
.msg{max-width:88%;padding:10px 12px;border-radius:12px;line-height:1.75;font-size:14px;white-space:pre-line}
.msg.bot{background:var(--soft);align-self:flex-start}
.msg.me{background:#FFE9A8;align-self:flex-end}
.bar{height:8px;background:#F2F2F2;border-radius:999px;overflow:hidden}.bar i{display:block;height:100%;background:var(--green);border-radius:999px}
.onb{max-width:720px;margin:40px auto}
.steps{display:flex;gap:6px;margin-bottom:16px}.steps i{flex:1;height:6px;border-radius:999px;background:#DAD5E3}.steps i.on{background:var(--green)}
.auth{min-height:100vh;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);background:#fff}
.auth-side{background:radial-gradient(1200px 600px at 100% 0%,#4A2A85 0%,#301A5B 55%);color:#F7F5FB;padding:56px 56px 40px;display:flex;flex-direction:column;justify-content:space-between;gap:32px}
.auth-side h2{font-size:34px;line-height:1.35;margin:0 0 14px;font-weight:700;letter-spacing:0}
.auth-side p{color:#CFC6E2;line-height:1.9;margin:0;font-size:16px;max-width:460px}
.auth-points{display:flex;flex-direction:column;gap:14px;margin-top:28px}
.auth-points div{display:flex;gap:12px;align-items:flex-start;color:#E9E4F3;font-size:15px;line-height:1.7}
.auth-points i{flex:none;width:26px;height:26px;border-radius:8px;background:rgba(255,204,51,.16);display:flex;align-items:center;justify-content:center;color:#FFCC33;font-style:normal;font-size:14px;font-weight:700}
.auth-main{display:flex;align-items:center;justify-content:center;padding:40px 24px}
.auth-box{width:100%;max-width:400px}
.auth-box h1{font-size:28px;margin:0 0 6px}
.auth-box .sub{color:var(--muted);margin:0 0 28px;line-height:1.7}
.stack{display:flex;flex-direction:column;gap:16px}
.field{display:flex;flex-direction:column;gap:6px;font-size:14px;font-weight:500;color:#3A3346}
.field input,.field textarea{min-height:48px;border:1px solid #D4CFDD;border-radius:12px;padding:10px 14px;font-size:15px;color:var(--ink);background:#fff;transition:border-color .15s,box-shadow .15s}
.field textarea{min-height:110px;resize:vertical;line-height:1.7}
.btn.lg{min-height:50px;font-size:16px;border-radius:12px;width:100%}
.switch{margin-top:22px;text-align:center;color:var(--muted);font-size:14px}
.switch button{background:none;border:0;color:var(--green);font-weight:600;padding:4px;font-size:14px}
.divider{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:13px;margin:6px 0}.divider:before,.divider:after{content:"";flex:1;height:1px;background:var(--line)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.6;color:#3A3346;padding:12px 14px;border:1px solid var(--line);border-radius:12px;cursor:pointer}
.check input{margin-top:4px;accent-color:var(--green);width:16px;height:16px}
.foot{color:#8C8496;font-size:12px}
@media (max-width:860px){.auth{grid-template-columns:1fr}.auth-side{padding:28px 24px;gap:12px}.auth-side h2{font-size:24px}.auth-points,.auth-side .foot{display:none}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media (max-width:700px){main{padding:12px}.kpi b{font-size:22px}}

/* ===== P0 shell & components ===== */
.shell{display:flex;min-height:100vh}
.sidebar{width:248px;flex:none;background:#fff;border-left:1px solid var(--line);position:sticky;top:0;height:100vh;overflow-y:auto;padding:20px 12px;display:flex;flex-direction:column;z-index:30}
.sb-brand{display:flex;align-items:center;gap:10px;padding:0 10px 18px}
.sb-brand .mk{width:38px;height:38px;border-radius:11px;background:#301A5B;display:grid;place-items:center}
.sb-brand b{display:block;font-size:17px;color:#301A5B}.sb-brand small{display:block;font-size:11px;color:var(--muted);max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-k{font-size:11px;color:#8C8496;padding:12px 12px 4px;font-weight:600}
.nav-i{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;color:#4A4458;border-radius:10px;padding:10px 12px;min-height:42px;text-align:right;font-weight:500;margin:1px 0}
.nav-i:hover{background:#F5F3F8;color:#301A5B}
.nav-i.on{background:#EEE9F7;color:#301A5B;font-weight:700;box-shadow:inset -3px 0 0 #301A5B}
.nav-i .ic{width:22px;text-align:center;font-size:15px;color:#7D7589}.nav-i.on .ic{color:#301A5B}
.nav-i .ct{margin-inline-start:auto;font-size:11px;font-weight:700;min-width:22px;text-align:center;border-radius:8px;padding:1px 6px;background:#FCE6E8;color:#AC0019}
.sb-foot{margin-top:auto;padding:12px;border-radius:12px;background:#F5F3F8;font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:8px}
.sb-foot b{color:#301A5B;font-size:13px}
.mainc{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);min-height:68px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 28px;flex-wrap:wrap}
.topbar .crumb{font-size:11px;color:var(--muted)}.topbar .tt{font-size:18px;font-weight:700;color:#301A5B}
.tctrl{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inp{min-height:40px;border:1px solid #D4CFDD;border-radius:10px;padding:0 10px;background:#fff;color:var(--ink);font-size:14px}
textarea.inp{padding:10px;line-height:1.7}
.menu-btn{display:none;width:40px;height:40px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:18px}
main.content{max-width:1400px;width:100%;margin:0 auto;padding:24px 28px 90px;box-sizing:border-box}
.phead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:20px}
.phead h1{font-size:24px;margin:0;color:#301A5B}.phead p{margin:6px 0 0;color:var(--muted);font-size:14px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-bottom:8px}
.stat{background:#fff;border:1px solid #E5E1EC;border-radius:14px;padding:16px 18px;text-align:right;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;font:inherit;color:inherit;cursor:pointer;min-height:132px}
.stat.static{cursor:default}.stat:not(.static):hover{border-color:#B9AECF}
.stat .cap{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:13px}
.stat .val b{font-size:28px;color:#301A5B}.stat .val small{color:var(--muted)}
.stat .note{font-size:12px;color:#3A3346}.stat .note.muted{color:var(--muted)}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
.sb{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap}
.sb i{font-style:normal;font-weight:700}
.sb.good{background:#E3F4EA;color:#1D6B43}.sb.bad{background:#FCE6E8;color:#AC0019}.sb.warn{background:#FFF1D6;color:#8A5A07}.sb.muted{background:#EFEDF2;color:#5E5868}
.sec-t{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px;gap:10px}.sec-t h2{font-size:17px;margin:0;color:#301A5B}
.lnk{background:none;border:0;color:#301A5B;font-weight:700;padding:4px 0;font-size:14px;text-decoration:underline;text-decoration-color:#FFCC33;text-decoration-thickness:2px;text-underline-offset:4px}
.grid2{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px}.grid2.wide{grid-template-columns:minmax(0,1.7fr) minmax(0,1fr)}
.card.pad{padding:20px}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.ph h3{margin:0;font-size:15px;color:#301A5B}.ph small{color:var(--muted)}
.insight{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;padding:16px 0;border-top:1px solid #EFEDF2}
.insight:first-child{border-top:0;padding-top:4px}
.sym{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:17px;font-weight:700}
.sym.bad{background:#FCE6E8;color:#AC0019}.sym.warn{background:#FFF1D6;color:#8A5A07}.sym.muted{background:#EFEDF2;color:#5E5868}
.ins-t{font-weight:700;color:#262626}.ins-d{font-size:13px;color:var(--muted);line-height:1.7;margin-top:2px}
.ins-meta{display:flex;flex-direction:column;gap:2px;font-size:12px;color:#5E5868;margin-top:6px}
.ins-a{display:flex;gap:12px;align-items:center;margin-top:8px;flex-wrap:wrap}
.amt{text-align:left;min-width:90px}.amt b{font-size:17px;color:#301A5B;display:block}.amt span{font-size:11px;color:var(--muted)}
.empty{text-align:center;padding:40px 16px;color:var(--muted)}.empty strong{display:block;color:#301A5B;font-size:16px;margin-bottom:6px}.empty p{margin:0 auto 16px;max-width:460px;line-height:1.8}
table.dt{width:100%;border-collapse:collapse;min-width:720px}
table.dt th{background:#F8F7FA;font-size:12px;color:#6E6779;padding:11px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
table.dt td{padding:12px;border-bottom:1px solid #EFEDF2;font-size:14px;vertical-align:middle}
table.dt tfoot td{background:#FAF9FC;border-top:2px solid var(--line)}
table.dt tr.click{cursor:pointer}table.dt tr.click:hover td,table.dt tr.click:focus td{background:#FBFAFD}
.toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.toolbar-r{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;gap:4px;background:#F2F0F5;border-radius:11px;padding:4px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:8px;padding:7px 12px;color:#5E5868;font-size:13px;min-height:36px}
.seg button.on{background:#fff;color:#301A5B;font-weight:700;box-shadow:0 1px 3px rgba(48,26,91,.12)}
.banner{padding:12px 14px;border-radius:12px;background:#F5F3F8;margin:12px 0;font-size:14px;line-height:1.7}
.banner.bad{background:#FCE6E8;color:#7A0012}.banner.warn{background:#FFF1D6;color:#6B4605}.banner.good{background:#E3F4EA;color:#1D6B43}
.panel-mask{position:fixed;inset:0;background:rgba(48,26,91,.45);z-index:60;display:flex;justify-content:flex-end;flex-direction:row-reverse}
.side{width:min(560px,96vw);height:100vh;overflow-y:auto;background:#fff;padding:24px;box-shadow:-20px 0 60px rgba(48,26,91,.2);box-sizing:border-box;animation:slin .18s ease-out}
@keyframes slin{from{transform:translateX(-30px);opacity:.4}to{transform:none;opacity:1}}
.side-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}.side-top h2{margin:2px 0 0;font-size:20px;color:#301A5B}
.eyebrow{font-size:12px;color:var(--muted)}
.x{width:40px;height:40px;border-radius:10px;border:0;background:#F2F0F5;font-size:22px;flex:none}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #EFEDF2;font-size:14px}.kv span{color:var(--muted)}.kv strong{color:#262626;text-align:left}
.note-box{background:#F5F3F8;border-radius:12px;padding:12px 14px;margin:12px 0;font-size:13px;line-height:1.8;color:#3A3346}.note-box.warn{background:#FFF1D6;color:#6B4605}
.ev{margin:0;padding:0 18px 0 0;line-height:1.9;font-size:14px}.ev li{margin-bottom:6px}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px;align-items:center}
.h2{font-size:18px;margin:4px 0 10px;color:#301A5B}.h3{font-size:15px;margin:18px 0 8px;color:#301A5B}
.stepper{display:flex;gap:6px;list-style:none;padding:0;margin:0 0 20px;flex-wrap:wrap}
.stepper li{display:flex;align-items:center;gap:6px;font-size:12px;color:#8C8496;flex:1;min-width:90px;border-top:3px solid #E2DFE8;padding-top:8px}
.stepper li span{width:22px;height:22px;border-radius:50%;background:#EFEDF2;display:grid;place-items:center;font-size:11px;font-weight:700}
.stepper li.on{color:#301A5B;font-weight:700;border-color:#FFCC33}.stepper li.on span{background:#FFCC33;color:#301A5B}
.stepper li.done{color:#301A5B;border-color:#301A5B}.stepper li.done span{background:#301A5B;color:#fff}
.opt2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:16px}
.opt{border:2px solid #E2DFE8;border-radius:14px;padding:16px;background:#fff;text-align:right;display:flex;flex-direction:column;gap:6px;font:inherit;color:inherit}
.opt.on{border-color:#301A5B;background:#F8F6FC}.opt b{color:#301A5B}.opt span{font-size:13px;color:var(--muted);line-height:1.6}
.form2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.drop{display:flex;flex-direction:column;align-items:center;gap:6px;border:2px dashed #B9AECF;border-radius:14px;padding:30px;background:#FAF9FC;cursor:pointer;text-align:center;color:#301A5B}
.drop input{max-width:100%}
.mapgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin:12px 0}
.req{color:#AC0019}
.success{text-align:center;padding:10px 0}.success .big{width:56px;height:56px;border-radius:50%;background:#E3F4EA;color:#1D6B43;display:grid;place-items:center;font-size:28px;margin:0 auto 8px}
.ask{display:flex;gap:8px;margin-top:10px}.ask input{flex:1;min-height:44px;border:1px solid #D4CFDD;border-radius:22px;padding:0 14px}
.bottomnav{display:none}
.sidebar-mask{display:none}
@media (max-width:1100px){.grid2,.grid2.wide{grid-template-columns:1fr}}
@media (max-width:860px){

function seedBranch(menu,cfg,t0){
 var b=newBranch(cfg.name,cfg.manager,2000,t0);b.ingredients=baseIngredients();
 b.ingredients.forEach(function(g){g.stock=Math.round(g.stock*cfg.stockF*10)/10});
 var chans=['صالة','تيك أواي','طلبات','كيتا','صالة','صالة','تيك أواي'];
 var span=Math.max(3600000,now()-t0-600000);
 for(var i=0;i<cfg.orders;i++){
  var lines=[],n=1+Math.floor(Math.random()*3);
  for(var j=0;j<n;j++){var m=menu[Math.floor(Math.random()*menu.length)];var ex=lines.filter(function(l){return l.mid===m.id})[0];if(ex)ex.qty++;else lines.push({mid:m.id,name:m.name,price:m.price,qty:1})}
  var ch=chans[i%chans.length];var tot=lines.reduce(function(a,l){return a+l.price*l.qty},0);
  b.orders.push({id:'#'+(b.seq++),t:t0+Math.floor(span*i/cfg.orders),channel:ch,lines:lines,subtotal:tot,discount:0,total:tot,pay:(ch==='طلبات'||ch==='كيتا')?'تطبيق':(i%3===0?'بطاقة':'نقدي'),status:'ready',cashier:cfg.cashier,voided:false});
 }
 for(var v=0;v<cfg.voids;v++){var o=b.orders[3+v*2];if(o){o.voided=true;b.voids.push({order:o.id,amt:o.total,t:o.t+60000,by:cfg.cashier,approver:'مدير الفرع',reason:v%2?'خطأ في الإدخال':'العميل غيّر الطلب'})}}
 b.expenses.push({id:uid('e'),desc:'أسطوانة غاز',amt:150,t:t0+3600000,cat:'تشغيل'});
 b.waste.push({id:uid('w'),ing:'veg',q:cfg.waste,reason:'تلف',t:t0+5400000});
 b.purchases.push({id:'PO-'+cfg.po,sup:'s1',t:t0-3*3600000,status:'received',lines:[{ing:'chicken',q:50,cost:210,rq:cfg.recv}],receivedAt:t0-2.5*3600000});
 b.purchases.push({id:'PO-'+(cfg.po+1),sup:'s2',t:t0-3*3600000,status:'received',lines:[{ing:'bread',q:300,cost:2.5,rq:300}],receivedAt:t0-2.4*3600000});
 var y=t0-24*3600000;
 b.history.push({openedAt:y,closedAt:y+13*3600000,sales:cfg.yday,profit:cfg.yday*0.19,expected:cfg.yday*0.4,counted:cfg.yday*0.4-cfg.cashDiff});
 return b;
}

 ]);
 for(var i=0;i<r.length;i++){if(r[i].error){fail(r[i].error,'تعذّر تحميل البيانات');return}}
 var org=r[0].data,d=org.data||{};AUTH.orgVersion=org.version;AUTH.members=r[4].data||[];AUTH.invites=r[5].data||[];
 var prevCur=(S&&S.cur)||prefs().cur;var chat=S?S.chat:[];
 S={v:3,onboarded:true,name:org.name,pin:d.pin||'1234',menu:d.menu||[],suppliers:d.suppliers||[],role:AUTH.member.role,chat:chat||[],branches:[],
  ext:{orders:r[6].data||[],payouts:r[7].data||[],imports:r[8].data||[],cases:r[9].data||[],audit:r[10].data||[]}};
 r[1].data.forEach(function(row){var bd=row.data||{};
  S.branches.push({id:row.id,name:row.name,manager:row.manager||'',version:row.version,
   voids:bd.voids||[],waste:bd.waste||[],purchases:bd.purchases||[],expenses:bd.expenses||[],history:bd.history||[],payments:bd.payments||[],
   shift:bd.shift||{open:true,openedAt:Date.now(),openingCash:0},
   ingredients:r[2].data.filter(function(x){return x.branch_id===row.id}).map(function(x){return{id:x.ing_key,name:x.name,unit:x.unit,stock:+x.stock,cost:+x.cost,min:+x.min,sup:x.sup}}),
   orders:r[3].data.filter(function(x){return x.branch_id===row.id}).map(function(x){var o=x.data||{};o.id=x.no;o.dbid=x.id;o.status=x.status;return o})});
 });

  .on('postgres_changes',{event:'*',schema:'public',table:'mz_orders',filter:'org_id=eq.'+AUTH.orgId},softReload)

  var org=res.data.org;AUTH.orgId=org;
  b0.payments=[{id:uid('p'),sup:'s1',amt:15000,t:Date.now()-86400000,note:'دفعة تحت الحساب'}];

function ing(id){return B.ingredients.filter(function(x){return x.id===id})[0]}

function item(id){return S.menu.filter(function(x){return x.id===id})[0]}
function shiftOrders(){return B.orders.filter(function(o){return o.t>=B.shift.openedAt})}
function liveOrders(){return shiftOrders().filter(function(o){return !o.voided})}
function recipeCost(m){return (m.recipe||[]).reduce(function(a,r){var g=ing(r.ing);var q=lineQty(r,g);return a+(g&&!isNaN(q)?g.cost*q:0)},0)}
function lowItems(){return B.ingredients.filter(function(g){return g.stock<=g.min})}

function stats(){
 var os=liveOrders();var byPay={},disc=0;var sales=0,cost=0,cash=0,count=os.length,byItem={},byCh={};
 os.forEach(function(o){sales+=o.total;if(o.pay==='نقدي')cash+=o.total;byPay[o.pay]=(byPay[o.pay]||0)+o.total;disc+=o.discount||0;byCh[o.channel]=(byCh[o.channel]||0)+o.total;
  o.lines.forEach(function(l){var m=item(l.mid);var c=m?recipeCost(m)*l.qty:0;cost+=c;byItem[l.name]=(byItem[l.name]||0)+l.qty})});
 var exp=B.expenses.filter(function(e){return e.t>=B.shift.openedAt}).reduce(function(a,e){return a+e.amt},0);
 var wasteCost=B.waste.filter(function(w){return w.t>=B.shift.openedAt}).reduce(function(a,w){var g=ing(w.ing);return a+(g?g.cost*w.q:0)},0);
 var top=Object.keys(byItem).map(function(k){return{n:k,q:byItem[k]}}).sort(function(a,b){return b.q-a.q});
 var voids=B.voids.filter(function(v){return v.t>=B.shift.openedAt});
 var supDiff=B.purchases.filter(function(p){return p.status==='received'&&p.receivedAt>=B.shift.openedAt-6*3600000}).reduce(function(a,p){return a+p.lines.reduce(function(b,l){return b+Math.max(0,(l.q-l.rq))*l.cost},0)},0);
 return{byPay:byPay,disc:disc,sales:sales,cost:cost,cash:cash,count:count,avg:count?sales/count:0,exp:exp,waste:wasteCost,profit:sales-cost-exp-wasteCost,costPct:sales?cost/sales*100:0,top:top,byCh:byCh,voids:voids,supDiff:supDiff,expectedCash:B.shift.openingCash+cash-exp};
}

/* ---------- reconciliation engine (deterministic) ---------- */
function recon(){
 var ids=scopeIds();var r=periodRange();var X=S.ext;
 var pay={},cover={},refsByKey={};
 X.payouts.forEach(function(p){if(ids.indexOf(p.branch_id)<0)return;var k=p.source+'|'+p.external_id;pay[k]=(pay[k]||0)+(+p.amount);(refsByKey[k]=refsByKey[k]||[]).push(p);var t=Date.parse(p.paid_at);if(!cover[p.source]||t>cover[p.source])cover[p.source]=t});
 var cases={};X.cases.forEach(function(c){if(c.kind==='settle')cases[c.ref]=c});
 var rows=[],known={};
 X.orders.forEach(function(o){if(ids.indexOf(o.branch_id)<0)return;var t=Date.parse(o.order_at);var k=o.source+'|'+o.external_id;known[k]=1;if(t<r[0]||t>=r[1])return;
  var due=+o.due,paid=Math.round((pay[k]||0)*100)/100,diff=Math.round((due-paid)*100)/100,state;
  if(!pay[k]){state=(cover[o.source]&&t<cover[o.source]-86400000)?'unpaid':'pending'}
  else if(Math.abs(diff)<=0.5)state='matched';else if(diff>0)state='short';else state='over';
  var c=cases['settle:'+k];
  rows.push({o:o,k:k,t:t,due:due,paid:paid,diff:diff,state:state,refs:refsByKey[k]||[],c:c,branch:o.branch_id,source:o.source});
 });
 var orphans=X.payouts.filter(function(p){return ids.indexOf(p.branch_id)>=0&&!known[p.source+'|'+p.external_id]});
 var T={count:rows.length,due:0,paid:0,open:0,openN:0,pendingDue:0,pendingN:0,matchedN:0,resolved:0};
 rows.forEach(function(x){T.due+=x.due;T.paid+=x.paid;var closed=x.c&&(x.c.status==='resolved'||x.c.status==='accepted'||x.c.status==='dismissed');
  if((x.state==='short'||x.state==='unpaid')&&!closed){T.open+=Math.max(0,x.diff);T.openN++}
  if(x.state==='pending'){T.pendingDue+=x.due;T.pendingN++}if(x.state==='matched')T.matchedN++;
  if(x.c&&x.c.status==='accepted')T.resolved+=+x.c.amount});
 return{rows:rows,T:T,cover:cover,orphans:orphans};
}

/* ---------- profitability (estimate) ---------- */
function profit(){
 var ids=scopeIds();var P={pos:0,posCost:0,ext:0,extDisc:0,comm:0,extCost:0,exp:0,waste:0,orders:0};
 S.branches.forEach(function(b){if(ids.indexOf(b.id)<0)return;
  withBranch(b,function(){
   b.orders.forEach(function(o){if(o.voided||!inRange(o.t))return;P.pos+=o.total;P.orders++;o.lines.forEach(function(l){var m=item(l.mid);if(m)P.posCost+=recipeCost(m)*l.qty})});
   b.expenses.forEach(function(e){if(inRange(e.t))P.exp+=e.amt});
   b.waste.forEach(function(w){if(!inRange(w.t))return;var g=ing(w.ing);if(g)P.waste+=g.cost*w.q});
  })});
 S.ext.orders.forEach(function(o){if(ids.indexOf(o.branch_id)<0||!inRange(Date.parse(o.order_at)))return;P.ext+=(+o.gross)-(+o.discount);P.extDisc+=+o.discount;P.comm+=+o.commission;P.orders++});
 var costed=S.menu.filter(function(m){return m.recipe&&m.recipe.length&&m.price});
 P.avgCostPct=costed.length?costed.reduce(function(a,m){return a+recipeCostAny(m)/m.price},0)/costed.length:0.32;
 P.costBasis=costed.length?'متوسط تكلفة '+costed.length+' صنفًا لهم وصفة':'افتراض 32% لعدم وجود وصفات';
 P.extCost=P.ext*P.avgCostPct;
 P.net=P.pos+P.ext;P.profit=P.net-P.comm-P.posCost-P.extCost-P.exp-P.waste;
 return P;
}

 if(/ربح|مكسب/.test(q))return 'الربح التقديري حتى الآن '+money(st.profit)+'.\nالمبيعات '+money(st.sales)+'، وتكلفة المكونات '+money(st.cost)+' ('+fmt1(st.costPct)+'%)، والمصروفات '+money(st.exp)+'، والهالك '+money(st.waste)+'.';

 if(/صنف|اكثر|افضل|طبق/.test(q))return st.top.length?'الأكثر مبيعًا:\n'+st.top.slice(0,5).map(function(t,i){return (i+1)+'. '+t.n+' ('+t.q+')'}).join('\n'):'لا مبيعات بعد.';
 if(/مخزون|ناقص|نفد|خلص|شراء/.test(q)){var l=lowItems();return l.length?'المكونات المنخفضة:\n'+l.map(function(g){return '- '+g.name+': '+fmt1(g.stock)+' '+g.unit}).join('\n')+'\nطلب الشراء المقترح جاهز في صفحة المشتريات.':'كل المكونات فوق الحد الأدنى.'}
 if(/الغاء|ملغ|سرق/.test(q))return st.voids.length?'الفواتير الملغاة في هذه الوردية:\n'+st.voids.map(function(v){return '- '+v.order+' · '+money(v.amt)+' · الكاشير '+v.by+' · بموافقة '+v.approver+' · '+v.reason}).join('\n'):'لا توجد فواتير ملغاة في هذه الوردية.';
 if(/نقد|درج|كاش/.test(q))return 'المفترض في الدرج الآن '+money(st.expectedCash)+': نقدية افتتاحية '+money(B.shift.openingCash)+' + مبيعات نقدية '+money(st.cash)+' − مصروفات '+money(st.exp)+'.';
 if(/مورد|استلام/.test(q))return st.supDiff>0?'فروقات الاستلام الأخيرة بقيمة '+money(st.supDiff)+'، وتفاصيلها في صفحة المشتريات.':'لا توجد فروقات في الاستلامات الأخيرة.';
 return 'لا أملك إجابة موثقة لهذا السؤال بعد. يمكنك سؤالي عن: المبالغ تحت المراجعة، الربح، الأصناف الأقل هامشًا، المبيعات، أكثر صنف مبيعًا، المخزون الناقص، الفواتير الملغاة، النقدية في الدرج، أو فروقات الموردين.';
}

function branchScore(st,b,al){var sc=100;sc-=Math.max(0,st.costPct-33)*3;sc-=st.voids.length*5;sc-=lowItemsOf(b)*2;var h=b.history[b.history.length-1];if(h&&Math.abs(h.counted-h.expected)>=1)sc-=10;return Math.max(0,Math.min(100,Math.round(sc)))}

function scopeBranches(){if(S.role!=='owner')return[B];if(UI.acctScope&&UI.acctScope!=='all'){var b=S.branches.filter(function(x){return x.id===UI.acctScope})[0];if(b)return[b]}return S.branches}
function purchVal(b,supId){return b.purchases.filter(function(p){return p.status==='received'&&(!supId||p.sup===supId)}).reduce(function(a,p){return a+p.lines.reduce(function(c,l){return c+(l.rq||0)*l.cost},0)},0)}
function supRows(bs){var ids=bs.map(function(b){return b.id});return S.suppliers.map(function(s){var pur=bs.reduce(function(a,b){return a+purchVal(b,s.id)},0);var paid=allPayments().filter(function(p){return p.sup===s.id&&ids.indexOf(p.branch)>=0}).reduce(function(a,p){return a+p.amt},0);return{s:s,pur:pur,paid:paid,bal:pur-paid}}).filter(function(r){return r.pur||r.paid})}
function plRows(bs){return bs.map(function(b){var st=withBranch(b,stats);return{b:b,st:st}})}

 var scope=S.role==='owner'?'<div class="chips">'+[['all','كل الفروع']].concat(S.branches.map(function(b){return[b.id,b.name]})).map(function(o){return '<button class="chip '+((UI.acctScope||'all')===o[0]?'on':'')+'" data-act="acct-scope" data-v="'+o[0]+'">'+esc(o[1])+'</button>'}).join('')+'</div>':'';

 (pl.length>1?'<section class="col card"><h2>مقارنة الفروع</h2><div class="scroll"><table><thead><tr><th>الفرع</th><th>المبيعات</th><th>التكلفة</th><th>المصروفات</th><th>الربح</th><th>الهامش</th></tr></thead><tbody>'+pl.map(function(r){return '<tr><td><b>'+esc(r.b.name)+'</b></td><td>'+money(r.st.sales)+'</td><td>'+money(r.st.cost+r.st.waste)+'</td><td>'+money(r.st.exp)+'</td><td>'+money(r.st.profit)+'</td><td>'+fmt1(r.st.sales?r.st.profit/r.st.sales*100:0)+'%</td></tr>'}).join('')+'</tbody></table></div></section>':'')+'</div>'+

function toLatinDigits(t){return String(t).replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)}).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)})}
function parseMenu(text){
 var out=[],cat='عام';
 toLatinDigits(text||'').split(/\n|،(?=\s*\D)/).forEach(function(raw){
  var line=raw.trim();if(!line)return;
  var h=line.match(/^(.+?)\s*:\s*$/);if(h){cat=h[1].trim();return}
  var m=line.match(/^(.+?)[\s\-–:=،,]+(\d+(?:[.,]\d+)?)\s*(ج\.?م|جنيه|ريال|ر\.?س)?\s*$/);
  if(m)out.push({name:m[1].replace(/[\-–:=،,]+$/,'').trim(),price:parseFloat(m[2].replace(',','.')),cat:cat});
  else out.push({name:line,price:0,cat:cat,missing:true});
 });
 return out;
}

 checkout:async function(){
  if(!UI.cart.length||UI.busy)return;var sub=UI.cart.reduce(function(a,l){return a+l.price*l.qty},0);var disc=Math.round(sub*UI.discount/100);
  var o={id:'…',t:now(),channel:UI.channel,lines:UI.cart.map(function(l){return{mid:l.mid,name:l.name,price:l.price,qty:l.qty}}),subtotal:sub,discount:disc,total:sub-disc,pay:UI.pay,status:'kitchen',cashier:UI.roleName||'الكاشير',voided:false};
  var b=B;var deltas=recipeDeltas(o.lines,-1);
  b.orders.push(o);deduct(o.lines,1);UI.cart=[];UI.discount=0;UI.busy=true;render();
  var payload=Object.assign({},o);delete payload.id;
  var r=await SB.rpc('mz_place_order',{p_branch:b.id,p_order:payload,p_deltas:deltas});
  UI.busy=false;
  if(r.error){fail(r.error,'لم يُحفظ الطلب. تحقق من الاتصال وأعد المحاولة');await loadAll();return}
  o.id=r.data.no;o.dbid=r.data.id;render();toast('تم الدفع '+money(o.total)+' · أُرسل الطلب '+o.id+' للمطبخ وخُصم المخزون');
 },
 void:function(v){var o=B.orders.filter(function(x){return x.id===v})[0];if(!o)return;var b=B;
  var m=askPin('إلغاء الطلب '+v,'الإلغاء بعد الدفع يحتاج موافقة المدير ويُسجّل في تقرير المالك.',async function(r){o.voided=true;b.voids.push({order:o.id,amt:o.total,t:now(),by:o.cashier,approver:'المدير',reason:r||'بدون سبب'});render();
   if(await updateOrder(o)&&await saveBranch(b)){audit('إلغاء فاتورة بعد الدفع','order',o.id,{amount:o.total,reason:r||'',cashier:o.cashier},b.id);render();toast('أُلغي الطلب وسُجّل في تقرير المالك')}});
  var box=m.querySelector('#pin-r');box.innerHTML='<label class="f">سبب الإلغاء<select id="reason"><option>العميل غيّر الطلب</option><option>خطأ في الإدخال</option><option>تأخر الطلب</option><option>شكوى جودة</option></select></label>';
 },
 ready:async function(v){var o=B.orders.filter(function(x){return x.id===v})[0];if(!o)return;o.status='ready';o.readyAt=now();render();if(await updateOrder(o))toast('جُهّز الطلب '+v)},
 po:async function(v){var g=suggestion()[v];if(!g)return;var b=B;var p={id:'PO-'+(3000+Math.floor(Math.random()*6000)),sup:v,t:now(),status:'ordered',lines:g.map(function(l){return{ing:l.ing,q:l.q,cost:l.cost,rq:null}})};b.purchases.push(p);render();if(await saveBranch(b)){render();toast('أُنشئ أمر الشراء '+p.id)}},
 recv:function(v){var b=B;var p=b.purchases.filter(function(x){return x.id===v})[0];if(!p)return;
  var m=modal('<h2>استلام '+p.id+'</h2><p class="muted" style="line-height:1.7">اكتب الوزن أو العدد الفعلي لكل صنف. في النسخة الكاملة يقرأ الميزان الذكي الوزن تلقائيًا.</p>'+p.lines.map(function(l,i){var x=ing(l.ing);return '<div class="form" style="margin-bottom:8px"><label class="f">'+esc(x?x.name:l.ing)+' · المطلوب '+fmt1(l.q)+' '+(x?x.unit:'')+'<input id="rq'+i+'" inputmode="decimal" value="'+l.q+'"></label></div>'}).join('')+'<div class="form" style="margin-top:12px"><button class="btn ghost" data-m="x">إلغاء</button><button class="btn" data-m="ok">اعتماد الاستلام</button></div>');
  m.addEventListener('click',async function(e){var a=e.target.getAttribute('data-m');if(a==='x')closeModal();if(a==='ok'){var diff=0,deltas={};p.lines.forEach(function(l,i){var r=parseFloat(m.querySelector('#rq'+i).value);if(isNaN(r))r=l.q;l.rq=r;deltas[l.ing]=(deltas[l.ing]||0)+r;var x=ing(l.ing);if(x)x.stock=Math.round((x.stock+r)*1000)/1000;diff+=Math.max(0,l.q-r)*l.cost});p.status='received';p.receivedAt=now();closeModal();render();
   if(await saveBranch(b)&&await stockDelta(b,deltas)){audit('اعتماد استلام','purchase',p.id,{supplier:(sup(p.sup)||{}).name,shortValue:Math.round(diff)},b.id);render();toast(diff>0?'اعتُمد الاستلام · فرق '+money(diff)+' يُخصم من حساب المورد':'اعتُمد الاستلام وأُضيف المخزون')}}});
 },
 count:function(v){var b=B;var g=ing(v);if(!g)return;var m=modal('<h2>جرد '+esc(g.name)+'</h2><p class="muted" style="margin-top:-4px">الرصيد المسجّل في النظام: <b>'+fmt1(g.stock)+' '+esc(g.unit)+'</b></p><div class="stack"><label class="field">الكمية الفعلية بعد العدّ ('+esc(g.unit)+')<input id="cnt" inputmode="decimal" dir="ltr" value="'+g.stock+'"></label><label class="field">سبب الفرق (مطلوب عند وجود فرق)<select id="cnt-r" class="inp"><option value="">— اختر —</option><option>هالك غير مسجّل</option><option>خطأ في الاستلام</option><option>خطأ في الوصفة أو الكمية</option><option>تسوية جرد دوري</option><option>سبب آخر</option></select></label><div id="cnt-d" class="banner" style="margin:0">لا يوجد فرق.</div></div><div class="form" style="margin-top:16px"><button class="btn ghost" data-m="x">إلغاء</button><button class="btn hot" data-m="ok">اعتماد الجرد</button></div>');
  var upd=function(){var c=parseFloat(toLatinDigits(m.querySelector('#cnt').value));var d=isNaN(c)?0:c-g.stock;var box=m.querySelector('#cnt-d');box.className='banner '+(Math.abs(d)<0.001?'':(d<0?'bad':'warn'));box.textContent=isNaN(c)?'اكتب رقمًا صحيحًا':(Math.abs(d)<0.001?'لا يوجد فرق.':(d<0?'عجز ':'زيادة ')+fmt1(Math.abs(d))+' '+g.unit+' بقيمة '+money(Math.abs(d)*g.cost))};m.addEventListener('input',upd);upd();
  m.addEventListener('click',async function(e){var a=e.target.getAttribute('data-m');if(a==='x')closeModal();if(a==='ok'){var c=parseFloat(toLatinDigits(m.querySelector('#cnt').value));if(isNaN(c)||c<0){toast('اكتب كمية صحيحة');return}var d=g.stock-c;var reason=m.querySelector('#cnt-r').value;if(Math.abs(d)>=0.001&&!reason){toast('اختر سبب الفرق قبل الاعتماد');return}
   var before=g.stock;g.stock=c;if(d>0)b.waste.push({id:uid('w'),ing:g.id,q:d,reason:'فرق جرد: '+reason,t:now()});closeModal();render();
   if(await setStock(b,g)&&(d<=0||await saveBranch(b))){audit('اعتماد جرد','stock',g.id,{item:g.name,before:before,after:c,unit:g.unit,reason:reason||'مطابق'},b.id);render();toast(Math.abs(d)>=0.001?'اعتُمد الجرد · فرق '+fmt1(Math.abs(d))+' '+g.unit:'اعتُمد الجرد · مطابق')}}});
 },
 waste:async function(){var b=B;var g=ing(val('w-ing'));var q=num('w-q');if(!g||!q){toast('اكتب الكمية');return}g.stock=Math.max(0,g.stock-q);b.waste.push({id:uid('w'),ing:g.id,q:q,reason:val('w-r'),t:now()});render();var dl={};dl[g.id]=-q;
  if(await saveBranch(b)&&await stockDelta(b,dl)){audit('تسجيل هالك','waste',g.id,{item:g.name,qty:q,unit:g.unit,reason:val('w-r')},b.id);render();toast('سُجّل هالك بقيمة '+money(q*g.cost))}},
 'add-ing':async function(){var b=B;var n=val('i-n');if(!n){toast('اكتب اسم المكوّن');return}var g={id:uid('g'),name:n,unit:val('i-u')||'وحدة',stock:num('i-s')||0,min:num('i-m')||0,cost:num('i-c')||0,sup:val('i-sup')};b.ingredients.push(g);render();if(await setStock(b,g))toast('أُضيف المكوّن')},
 exp:async function(){var b=B;var d=val('e-d'),a=num('e-a');if(!d||!a){toast('اكتب البيان والمبلغ');return}b.expenses.push({id:uid('e'),desc:d,amt:a,t:now(),cat:val('e-c')||'تشغيل'});render();if(await saveBranch(b)){render();toast('سُجّل المصروف')}},
 close:async function(){var b=B;var c=num('c-c');if(c===null){toast('اكتب النقدية المعدودة');return}var st=stats();b.history.push({openedAt:b.shift.openedAt,closedAt:now(),sales:st.sales,profit:st.profit,expected:st.expectedCash,counted:c});
  var d=c-st.expectedCash;b.shift={open:true,openedAt:now()+1,openingCash:c,closed:null};render();
  if(await saveBranch(b)){audit('إغلاق وردية','shift',b.id,{expected:Math.round(st.expectedCash),counted:c,diff:Math.round(d)},b.id);render();toast(Math.abs(d)<1?'أُغلقت الوردية · الدرج مطابق':'أُغلقت الوردية · '+(d<0?'عجز ':'زيادة ')+money(Math.abs(d)))}},
 quick:function(v){S.chat=(S.chat.length?S.chat:[]).concat([{who:'me',t:v},{who:'bot',t:answer(v)}]).slice(-20);render();var c=document.getElementById('chat');if(c)c.scrollTop=c.scrollHeight},
 'save-set':async function(){S.name=val('s-n')||S.name;S.pin=val('s-p')||S.pin;if(await saveOrg()){render();toast('حُفظت الإعدادات')}},
 tpl:function(v){var t=document.getElementById('qm');if(t){t.value=TEMPLATES[v]||'';t.focus();menuPreview()}},
 'qm-add':async function(){var items=parseMenu((document.getElementById('qm')||{}).value).filter(function(i){return !i.missing});if(!items.length)return;
  var added=0;items.forEach(function(i){var ex=S.menu.filter(function(m){return m.name===i.name})[0];if(ex){ex.price=i.price;ex.cat=i.cat}else{S.menu.push({id:uid('m'),name:i.name,price:i.price,cat:i.cat,recipe:[]});added++}});
  render();if(await saveOrg()){render();toast('أُضيف '+added+' صنفًا'+(items.length-added?' وحُدّث '+(items.length-added):''))}},
 recipe:function(v){recipeModal(v)},
 'quick-item':function(){quickItemModal()},
 'del-item':function(v){var m=item(v);if(!m)return;confirmBox('حذف «'+m.name+'» من المنيو في كل الفروع؟ الطلبات السابقة لا تتأثر.',async function(){S.menu=S.menu.filter(function(x){return x.id!==v});render();if(await saveOrg()){render();toast('حُذف الصنف')}})},
 'add-item':async function(){var n=val('m-n'),p=num('m-p');if(!n||!p){toast('اكتب الاسم والسعر');return}S.menu.push({id:uid('m'),name:n,price:p,cat:val('m-c')||'عام',recipe:[]});if(await saveOrg()){render();toast('أُضيف الصنف لكل الفروع')}},
 'add-rec':async function(){var m=item(val('r-m'));var q=num('r-q');if(!m||!q){toast('اكتب الكمية');return}var g=val('r-i');var ex=m.recipe.filter(function(r){return r.ing===g})[0];if(ex)ex.q=q;else m.recipe.push({ing:g,q:q});if(await saveOrg()){render();toast('حُدّثت الوصفة')}},
 'add-sup':async function(){var n=val('sp-n');if(!n)return;S.suppliers.push({id:uid('s'),name:n,phone:''});if(await saveOrg())render()},
 'save-phones':async function(){Array.prototype.forEach.call(document.querySelectorAll('[data-sup]'),function(i){var s=sup(i.getAttribute('data-sup'));if(s)s.phone=i.value.trim()});if(await saveOrg())toast('حُفظت الأرقام')},
 goto:function(v){var p=v.split('|');S.cur=p[0];UI.scope=p[0];syncB();save();UI.tab=p[1]||'home';render();window.scrollTo(0,0)},
 'acct-scope':function(v){UI.acctScope=v;render()},
 export:function(){exportCSV()},
 'pay-sup':function(v){var s=sup(v);var bs=scopeBranches();var r=supRows(bs).filter(function(x){return x.s.id===v})[0];if(!s||!r)return;
  var m=modal('<h2>دفعة إلى '+esc(s.name)+'</h2><p class="muted">الرصيد المستحق '+money(r.bal)+'</p><div class="form"><label class="f">المبلغ<input id="pa" inputmode="decimal" value="'+Math.round(r.bal)+'"></label>'+(S.role==='owner'?'<label class="f">يُحسب على فرع<select id="pb">'+bs.map(function(b){return '<option value="'+b.id+'">'+esc(b.name)+'</option>'}).join('')+'</select></label>':'')+'</div><div class="form" style="margin-top:12px"><button class="btn ghost" data-m="x">إلغاء</button><button class="btn" data-m="ok">تسجيل الدفعة</button></div>');
  m.addEventListener('click',async function(e){var a=e.target.getAttribute('data-m');if(a==='x')closeModal();if(a==='ok'){var amt=parseFloat(m.querySelector('#pa').value);if(!amt)return;var pb=m.querySelector('#pb');var tb=pb?S.branches.filter(function(x){return x.id===pb.value})[0]:B;tb.payments=tb.payments||[];tb.payments.push({id:uid('p'),sup:v,amt:amt,t:now(),note:''});closeModal();render();if(await saveBranch(tb)){audit('دفعة لمورد','payment',v,{supplier:s.name,amount:amt},tb.id);render();toast('سُجّلت دفعة '+money(amt))}}});
 },
 'add-branch':async function(){var n=val('b-n');if(!n){toast('اكتب اسم الفرع');return}var nb=newBranch(n,val('b-m'),num('b-c')||0);nb.payments=[];
  var ins=await SB.from('mz_branches').insert({org_id:AUTH.orgId,name:n,manager:nb.manager,data:docOf(nb)}).select('id').single();if(ins.error){fail(ins.error);return}
  var bb={id:ins.data.id};if(B.ingredients.length){var ig=await SB.from('mz_ingredients').insert(B.ingredients.map(function(g){return ingRow(bb,{id:g.id,name:g.name,unit:g.unit,stock:0,cost:g.cost,min:g.min,sup:g.sup})}));if(ig.error)fail(ig.error)}
  await loadAll();toast('أُضيف '+n)},
 invite:async function(){var code=Math.random().toString(36).slice(2,8).toUpperCase();var r=await SB.from('mz_invites').insert({code:code,org_id:AUTH.orgId,role:val('inv-role'),branch_id:val('inv-br'),created_by:AUTH.user.id});if(r.error){fail(r.error);return}audit('إنشاء دعوة','invite',code,{role:val('inv-role')});await loadAll();toast('كود الدعوة: '+code)},
 'rm-invite':async function(v){var r=await SB.from('mz_invites').delete().eq('code',v);if(r.error){fail(r.error);return}await loadAll()},
 'rm-member':function(v){confirmBox('سيفقد هذا الشخص الوصول إلى المطعم فورًا.',async function(){var r=await SB.from('mz_members').delete().eq('org_id',AUTH.orgId).eq('user_id',v);if(r.error){fail(r.error);return}await loadAll();toast('أُزيل من الفريق')})},
 'auth-mode':function(){UI.authMode=UI.authMode==='signup'?'login':'signup';UI.authMsg='';render()},
 logout:async function(){if(SB)await SB.auth.signOut();if(chan){SB.removeChannel(chan);chan=null}S=null;B=null;AUTH.user=null;UI.screen='auth';UI.authMsg='';render()},
 'create-org':async function(){if(UI.busy)return;var name=val('o-name'),menu=(document.getElementById('o-menu')||{}).value,cash=val('o-cash'),demo=(document.getElementById('o-demo')||{}).checked;
  UI.authMsg='';setBusy(true);try{await createOrg(name,menu,cash,demo);UI.busy=false;await loadAll();UI.tab=demo?'home':'data';render();toast('مطعمك جاهز')}catch(e){console.error(e);UI.busy=false;UI.authMsg='تعذّر إنشاء المطعم: '+(e.message||'');render()}},
 join:async function(){var code=val('j-code');if(!code)return;setBusy(true);var name=(AUTH.user.user_metadata&&AUTH.user.user_metadata.name)||'';var r=await SB.rpc('mz_accept_invite',{p_code:code,p_name:name});UI.busy=false;if(r.error){UI.authMsg='الكود غير صحيح أو مستخدم من قبل';render();return}await loadAll();toast('انضممت إلى المطعم')}
};
function confirmBox(t,cb){var m=modal('<h2>تأكيد</h2><p style="line-height:1.7">'+esc(t)+'</p><div class="form"><button class="btn ghost" data-m="x">إلغاء</button><button class="btn warn" data-m="ok">متابعة</button></div>');m.addEventListener('click',function(e){var a=e.target.getAttribute('data-m');if(a==='x')closeModal();if(a==='ok'){closeModal();cb()}});return false}

async function doAuth(){
 var su=UI.authMode==='signup';var email=val('a-email'),pass=(document.getElementById('a-pass')||{}).value||'',name=val('a-name');
 UI.authMsg='';setBusy(true);
 var r=su?await SB.auth.signUp({email:email,password:pass,options:{data:{name:name},emailRedirectTo:location.origin+location.pathname}}):await SB.auth.signInWithPassword({email:email,password:pass});
 UI.busy=false;
 if(r.error){UI.authMsgOk=false;UI.authMsg=/Invalid login/i.test(r.error.message)?'البريد أو كلمة المرور غير صحيحة':(/registered/i.test(r.error.message)?'هذا البريد مسجّل بالفعل. سجّل الدخول.':r.error.message);render();return}
 if(su&&r.data.user&&r.data.user.identities&&r.data.user.identities.length===0){UI.authMsgOk=false;UI.authMsg='هذا البريد مسجّل من قبل. سجّل الدخول بكلمة المرور الحالية لهذا البريد.';UI.authMode='login';render();return}
 if(su&&!r.data.session){UI.authMsgOk=true;UI.authMsg='أرسلنا رابط تأكيد إلى بريدك. افتحه ثم عُد وسجّل الدخول.';UI.authMode='login';render();return}
 AUTH.user=r.data.user;UI.screen='loading';render();await loadAll();
}
document.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b||b.tagName==='FORM')return;if(b.closest('.modal'))return;var a=b.getAttribute('data-act');if(A[a]){e.preventDefault();A[a](b.getAttribute('data-v'))}});
document.addEventListener('submit',function(e){var f=e.target;var a=f.getAttribute('data-act');if(a==='ask'){e.preventDefault();var q=val('q');if(q)A.quick(q)}if(a==='auth'){e.preventDefault();doAuth()}});
document.addEventListener('input',function(e){if(e.target.getAttribute&&e.target.getAttribute('data-input')==='qm')menuPreview()});
document.addEventListener('change',async function(e){var t=e.target;var f=t.getAttribute&&t.getAttribute('data-edit');if(!f)return;var m=item(t.getAttribute('data-id'));if(!m)return;
 if(f==='price'){var p=parseFloat(toLatinDigits(t.value));if(!(p>0)){t.value=m.price;toast('سعر غير صحيح');return}m.price=p}else if(f==='name'){if(!t.value.trim()){t.value=m.name;return}m.name=t.value.trim()}else if(f==='cat'){m.cat=t.value.trim()||'عام'}
 if(await saveOrg()){audit('تعديل صنف','menu',m.id,{field:f,item:m.name,value:t.value});toast('حُفظ التعديل')}});
document.addEventListener('change',function(e){var t=e.target;var c=t.getAttribute&&t.getAttribute('data-change');if(!c)return;
 if(c==='branch'){S.cur=t.value;syncB();save();render()}
 if(c==='scope'){UI.scope=t.value;if(t.value!=='all'){S.cur=t.value;syncB()}save();render()}
 if(c==='period'){UI.period=t.value;save();render()}
 if(c==='sf-source'){UI.sf.source=t.value;render()}
 if(c==='sf-q'){UI.sf.q=t.value.trim();render()}
 if(c==='aq'){UI.aq=t.value.trim();render()}
 if(c==='imp-map'){UI.imp.map[t.getAttribute('data-f')]=t.value===''?'':+t.value;render()}
 if(c==='imp-file'){var f=t.files&&t.files[0];if(!f)return;if(f.size>5*1024*1024){UI.imp.err='الملف أكبر من 5 ميجابايت. قسّمه إلى فترات أقصر.';render();return}if(!/\.csv$/i.test(f.name)&&f.type.indexOf('csv')<0){UI.imp.err='الملف ليس بصيغة CSV. صدّره من لوحة التطبيق بصيغة CSV ثم أعد المحاولة.';render();return}
  var rd=new FileReader();rd.onload=function(){loadCSVText(rd.result,f.name)};rd.onerror=function(){UI.imp.err='تعذّرت قراءة الملف. جرّب ملفًا آخر.';render()};rd.readAsText(f,'utf-8')}
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeModal();closePanel()}if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('click')){e.target.click()}});
(async function boot(){
 if(!SB){UI.screen='auth';UI.authMsg='تعذّر تحميل مكتبة الاتصال. تحقق من الإنترنت ثم أعد تحميل الصفحة.';render();return}
 var pf=prefs();UI.scope=pf.scope||'all';UI.period=pf.period||'30d';
 render();
 var r=await SB.auth.getSession();
 if(r.data&&r.data.session){AUTH.user=r.data.session.user;await loadAll()}else{UI.screen='auth';render()}
 SB.auth.onAuthStateChange(function(ev,session){if(ev==='SIGNED_IN'&&session&&!AUTH.user){AUTH.user=session.user;loadAll()}});
})();
})();
</script>
