async function loadCatalog(){
 const [r,m,z]=await Promise.all([sb.from('dl_restaurants').select('*').order('sort'),sb.from('dl_menu_items').select('*').order('sort'),sb.from('dl_zones').select('*').order('id')]);
 if(r.error||m.error||z.error)throw r.error||m.error||z.error;
 G.rests=r.data;G.menu=m.data;G.zones=z.data;
}
async function loadOrders(){
 if(!G.session){G.orders=[];return}
 const {data,error}=await sb.from('dl_orders').select('*').order('created_at',{ascending:false}).limit(300);
 if(error){console.error(error);return}
 const rl=role();
 if(rl==='restaurant'){const fresh=data.filter(o=>o.status==='new'&&!ST.known.has(o.id));if(!ST.first&&fresh.length){beep();toast('طلب جديد #'+fresh[0].id)}data.forEach(o=>ST.known.add(o.id));ST.first=false}
 if(rl==='driver'){const fresh=data.filter(o=>!o.driver_id&&!ST.known.has(o.id));if(!ST.first&&fresh.length&&ST.online){beep();toast('طلب توصيل جديد')}data.forEach(o=>ST.known.add(o.id));ST.first=false;
  const s=await sb.rpc('dl_driver_stats');if(!s.error)G.stats=s.data}
 G.orders=data;
 if(rl==='admin'){const c=await sb.from('dl_coupons').select('*').order('code');if(!c.error)G.coupons=c.data}
}
async function loadProfile(){

}

 if(T==='reports'){const days=[...Array(7)].map((_,i)=>{const d=new Date();d.setDate(d.getDate()-(6-i));return d});const vals=days.map(d=>os.filter(o=>o.status==='delivered'&&new Date(o.created_at).toDateString()===d.toDateString()).reduce((a,o)=>a+ +o.subtotal,0));const tot=vals.reduce((a,b)=>a+b,0),mx=Math.max(1,...vals);
  const comm=os.filter(o=>o.status==='delivered'&&days.some(d=>new Date(o.created_at).toDateString()===d.toDateString())).reduce((a,o)=>a+o.subtotal*o.commission_pct/100,0);
  body=`<div class="h1" style="margin-bottom:14px">التقارير والمستحقات — آخر 7 أيام</div><div class="kpis"><div class="kpi"><small>المبيعات المسلّمة</small><b class="num">${fmt(tot)}</b></div><div class="kpi"><small>عمولة المنصة (${r.commission}٪)</small><b class="num">${fmt(comm)}</b></div><div class="kpi"><small>صافي مستحقاتك</small><b class="num" style="color:var(--g)">${fmt(tot-comm)}</b></div><div class="kpi"><small>عدد الطلبات</small><b class="num">${os.filter(o=>o.status==='delivered').length}</b></div></div>
  <div class="card" style="padding:22px 18px 34px"><b style="color:var(--v)">المبيعات اليومية (${CUR})</b><div class="bars">${vals.map((v,i)=>`<div class="${i===6?'on':''}" style="height:${v/mx*140}px">${v?`<em>${fmt(v)}</em>`:''}<span>${i===6?'اليوم':days[i].toLocaleDateString('ar-SA',{weekday:'short'})}</span></div>`).join('')}</div></div>`}
 const m=ST.modal?G.orders.find(o=>o.id===ST.modal&&o.status==='new'):null;
 const modal=m?`<div class="modal-bg" data-rclose-bg><div class="modal"><div class="row sb"><b style="font-size:22px;color:var(--o)">طلب جديد #${m.id}</b><span class="mu">${ago(m.created_at)}</span></div>
  <div style="margin:12px 0">${m.items.map(it=>`<div class="line"><span>${it.q}× ${esc(it.name)}</span><span class="num">${fmt(it.q*it.price)}</span></div>`).join('')}${m.note?`<div class="mu">ملاحظة: ${esc(m.note)}</div>`:''}<div class="line t"><span>المجموع · ${{cash:'نقدًا',card:'بطاقة',wallet:'محفظة'}[m.pay_method]}</span><span class="num">${fmt(m.subtotal)} ${CUR}</span></div></div>
  <b style="color:var(--v)">وقت التجهيز</b><div class="pt">${[10,15,20,30].map(p=>`<button class="${ST.prep===p?'on':''}" data-prep="${p}">${p} د</button>`).join('')}</div>
  <div class="row" style="gap:10px;margin-top:6px"><button class="btn p" style="flex:2" data-ract="accept" data-id="${m.id}">قبول الطلب</button><button class="btn d" style="flex:1" data-ract="reject" data-id="${m.id}">رفض</button></div>
  <button class="mu w100" style="margin-top:10px" data-rclose>لاحقًا</button></div></div>`:'';
 return shell(esc(r.name),'لوحة المطعم',[['orders','الطلبات',nw.length],['menu','المنيو',0],['reports','التقارير',0]],T,'data-rtab',body,modal);
}
async function restClick(e){
 const t=e.target.closest('button,[data-rclose-bg]');if(!t)return;const d=t.dataset;
 if(d.rcloseBg!==undefined){if(e.target===t){ST.modal=null;render()}return}
 if(d.logout!==undefined){await sb.auth.signOut();return}
 if(d.rtab){ST.tab=d.rtab;render();return}
 if(d.rmodal){ST.modal=+d.rmodal;render();return}
 if(d.rclose!==undefined){ST.modal=null;render();return}
 if(d.prep){ST.prep=+d.prep;render();return}
 if(d.ract){t.disabled=true;const {error}=await sb.rpc('dl_order_action',{p_id:+d.id,p_action:d.ract,p_arg:d.ract==='accept'?String(ST.prep):null});if(error)toast(errMsg(error),1);else toast({accept:'تم قبول الطلب',reject:'تم رفض الطلب',ready:'تم إبلاغ المندوب'}[d.ract]);ST.modal=null;await loadOrders();render();return}
 if(d.ropen!==undefined){const r=rest(G.profile.restaurant_id);const {error}=await sb.from('dl_restaurants').update({open:!r.open}).eq('id',r.id);if(error)toast(errMsg(error),1);else{r.open=!r.open;render()}return}
 if(d.mav){const m=G.menu.find(x=>x.id===d.mav);const {error}=await sb.from('dl_menu_items').update({available:!m.available}).eq('id',m.id);if(error)toast(errMsg(error),1);else{m.available=!m.available;render()}return}
}
async function restChange(e){const d=e.target.dataset;if(d.mprice){const v=parseFloat(e.target.value);if(!(v>=0)){toast('سعر غير صالح',1);render();return}const {error}=await sb.from('dl_menu_items').update({price:v}).eq('id',d.mprice);if(error)toast(errMsg(error),1);else{G.menu.find(x=>x.id===d.mprice).price=v;toast('تم تحديث السعر')}}}

/* ================= DRIVER ================= */
function renderDriver(){
 const me=G.session.user.id;
 const job=G.orders.find(o=>o.driver_id===me&&['preparing','ready','picked'].includes(o.status));
 const offers=ST.online&&!job?G.orders.filter(o=>!o.driver_id&&['preparing','ready'].includes(o.status)):[];
 let b='';
 if(job){const r=rest(job.restaurant_id),stage=job.status==='picked'?job.driver_stage:0;
  const labels=['متجه للمطعم','استلمت الطلب','في الطريق للعميل','عند العميل'];
  b=`<div class="pad"><div class="row sb"><b class="h2">طلب #${job.id}</b><span class="badge b-o">${labels[stage]}</span></div><div class="dstep">${[0,1,2,3].map(i=>`<i class="${i<=stage?'on':''}"></i>`).join('')}</div>
  <div class="route"><div><b>${esc(r.name)}</b><div class="mu">الاستلام</div></div><div><b>${esc(job.address||'—')}</b><div class="mu">التسليم · ${esc(job.customer_name)}${job.note?' · '+esc(job.note):''}</div></div></div>
  <div class="card" style="padding:12px;margin-bottom:12px">${job.items.map(i=>`<div class="line"><span>${i.q}× ${esc(i.name)}</span></div>`).join('')}<div class="line t"><span>${job.pay_method==='cash'?'حصّل من العميل':'مدفوع مسبقًا'}</span><span class="num">${job.pay_method==='cash'?fmt(job.total)+' '+CUR:'✓'}</span></div></div>
  ${stage===0?(job.status==='ready'?`<button class="btn p w100" data-dact="pickup">وصلت واستلمت الطلب</button>`:`<button class="btn s w100" disabled>المطعم يجهّز الطلب…</button><p class="mu" style="text-align:center;margin-top:8px">سيصلك تنبيه عندما يصبح جاهزًا</p>`):''}
  ${stage===1?`<button class="btn p w100" data-dact="depart">ابدأ التوصيل للعميل</button>`:''}
  ${stage===2?`<button class="btn p w100" data-dact="arrive">وصلت للعميل</button>`:''}
  ${stage===3?`<b style="color:var(--v)">أدخل كود التسليم من العميل</b><div class="otp" style="margin:12px 0">${[0,1,2,3].map(i=>`<input maxlength="1" inputmode="numeric" data-dotp="${i}" aria-label="رقم ${i+1}">`).join('')}</div>${ST.dErr?`<div class="err">${esc(ST.dErr)}</div>`:''}<button class="btn g w100" style="margin-top:10px" data-dact="deliver">تأكيد التسليم</button>`:''}</div>`;
 } else if(!ST.online)b=`<div class="empty"><div class="ic">${I("bedtime")}</div>أنت غير متصل<br>اتصل لتبدأ استقبال الطلبات</div>`;
 else if(offers.length)b=offers.map(o=>{const r=rest(o.restaurant_id);return `<div class="offer"><div class="row sb"><b style="color:var(--o);font-size:17px">طلب توصيل #${o.id}</b><span class="badge b-g">+${fmt(Math.round(12+o.total*.05))} ${CUR}</span></div>
  <div class="route"><div><b>${esc(r.name)}</b><div class="mu">${o.status==='ready'?'جاهز للاستلام':'يُجهَّز الآن'}</div></div><div><b>${esc(o.address||'—')}</b><div class="mu">${o.items.length} أصناف · ${o.pay_method==='cash'?'نقدًا':'مدفوع'}</div></div></div>
  <button class="btn p w100" data-dtake="${o.id}">قبول</button></div>`}).join('');
 else b=`<div class="empty"><div class="ic">${I("radar")}</div>بانتظار طلبات قريبة منك…<br><span class="mu">سيصلك تنبيه فور وجود طلب</span></div>`;
 return `<div class="mob"><div class="view"><div class="d-head"><div class="row sb"><span style="font-size:13px;opacity:.85">أرباح اليوم</span><div class="row"><span style="font-size:13px">${ST.online?'متصل':'غير متصل'}</span><button class="switch ${ST.online?'on':''}" data-donline aria-label="اتصال"></button></div></div><b class="big num">${fmt(Math.round(G.stats.earn||0))} ${CUR}</b><div class="row sb"><span style="font-size:13px;opacity:.85" class="num">${G.stats.trips||0} توصيلات اليوم</span><button style="font-size:13px;color:#C9BFE0" data-logout>خروج</button></div></div>${b}</div></div>`;
}
async function drvClick(e){
 const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.logout!==undefined){await sb.auth.signOut();return}
 if(d.donline!==undefined){ST.online=!ST.online;render();return}
 if(d.dtake){t.disabled=true;const {error}=await sb.rpc('dl_order_action',{p_id:+d.dtake,p_action:'take'});if(error)toast(errMsg(error),1);else toast('الطلب لك، توجّه للمطعم');await loadOrders();render();return}
 if(d.dact){const job=G.orders.find(o=>o.driver_id===G.session.user.id&&['preparing','ready','picked'].includes(o.status));let arg=null;
  if(d.dact==='deliver'){arg=[...document.querySelectorAll('[data-dotp]')].map(i=>i.value).join('');if(arg.length<4){ST.dErr='أدخل الكود كاملًا';render();return}}
  t.disabled=true;const {error}=await sb.rpc('dl_order_action',{p_id:job.id,p_action:d.dact,p_arg:arg});
  if(error){ST.dErr=d.dact==='deliver'?errMsg(error):'';if(d.dact!=='deliver')toast(errMsg(error),1)}else{ST.dErr='';if(d.dact==='deliver')toast('تم التسليم بنجاح')}
  await loadOrders();render();return}
}

/* ================= ADMIN ================= */
function renderAdmin(){
 const T=ST.adminTab,os=G.orders,today=os.filter(o=>isToday(o.created_at));
 const live=os.filter(o=>!['delivered','rejected'].includes(o.status));
 const gmv=today.filter(o=>o.status!=='rejected').reduce((a,o)=>a+ +o.total,0);
 const comm=today.filter(o=>o.status==='delivered').reduce((a,o)=>a+o.subtotal*o.commission_pct/100,0);
 let body='';
 if(T==='dash'){const by=['new','preparing','ready','picked','delivered','rejected'].map(s=>[s,today.filter(o=>o.status===s).length]);const mx=Math.max(1,...by.map(x=>x[1]));
  const perR=G.rests.map(r=>[r,today.filter(o=>o.restaurant_id===r.id&&o.status!=='rejected')]).sort((a,b)=>b[1].length-a[1].length);
  body=`<div class="h1" style="margin-bottom:14px">نظرة عامة — اليوم</div>
 <div class="kpis"><div class="kpi"><small>طلبات اليوم</small><b class="num">${today.length}</b></div><div class="kpi"><small>قيمة المبيعات</small><b class="num">${fmt(gmv)}</b></div><div class="kpi"><small>عمولة المنصة (المسلّم)</small><b class="num" style="color:var(--g)">${fmt(comm)}</b></div><div class="kpi"><small>طلبات نشطة الآن</small><b class="num" style="color:var(--o)">${live.length}</b></div></div>
 <div class="grid2"><div class="card" style="padding:16px"><b style="color:var(--v)">الطلبات حسب الحالة</b>${by.map(([s,n])=>`<div style="margin-top:10px"><div class="row sb"><span>${statusLabel(s)[0]}</span><b class="num">${n}</b></div><div class="hbar"><i style="width:${n/mx*100}%"></i></div></div>`).join('')}</div>
 <div class="card" style="padding:16px"><b style="color:var(--v)">أداء المطاعم اليوم</b>${perR.map(([r,l])=>`<div class="row sb" style="padding:10px 0;border-bottom:1px solid var(--ln)"><span>${esc(r.name)}</span><span class="mu num">${l.length} طلب · ${fmt(l.reduce((a,o)=>a+ +o.subtotal,0))} ${CUR}</span></div>`).join('')}</div></div>`}
 if(T==='orders')body=`<div class="h1" style="margin-bottom:14px">كل الطلبات</div>${os.length?`<div class="tblw"><table class="tbl"><tr><th>#</th><th>الوقت</th><th>المطعم</th><th>العميل</th><th>الدفع</th><th>الإجمالي</th><th>الحالة</th></tr>${os.map(o=>{const l=statusLabel(o.status);return `<tr><td class="num">${o.id}</td><td class="mu">${ago(o.created_at)}</td><td>${esc(rest(o.restaurant_id).name)}</td><td>${esc(o.customer_name)}</td><td>${{cash:'نقدًا',card:'بطاقة',wallet:'محفظة'}[o.pay_method]}</td><td class="num">${fmt(o.total)}</td><td><span class="badge ${l[1]}">${l[0]}</span></td></tr>`}).join('')}</table></div>`:'<div class="empty">لا توجد طلبات بعد</div>'}`;
 if(T==='rests')body=`<div class="h1" style="margin-bottom:14px">المطاعم والعمولات</div><div class="tblw"><table class="tbl"><tr><th>المطعم</th><th>الحالة</th><th>التقييم</th><th>العمولة ٪</th></tr>${G.rests.map(r=>`<tr><td>${esc(r.name)}</td><td><span class="badge ${r.open?'b-g':'b-r'}">${r.open?'مفتوح':'مغلق'}</span></td><td class="num">★ ${r.rating}</td><td><input class="inp num" value="${r.commission}" data-comm="${r.id}" inputmode="decimal"></td></tr>`).join('')}</table></div><p class="mu" style="margin-top:10px">العمولة الجديدة تُطبَّق على الطلبات القادمة، وتظهر في تقارير المطعم.</p>`;
 if(T==='zones')body=`<div class="h1" style="margin-bottom:14px">مناطق التوصيل والرسوم</div><div class="tblw"><table class="tbl"><tr><th>المنطقة</th><th>رسوم التوصيل (${CUR})</th><th>مفعّلة</th></tr>${G.zones.map(z=>`<tr><td>${esc(z.name)}</td><td><input class="inp num" value="${z.fee}" data-zfee="${z.id}" inputmode="decimal"></td><td><button class="switch ${z.active?'on':''}" data-zon="${z.id}"></button></td></tr>`).join('')}</table></div><p class="mu" style="margin-top:10px">المنطقة المعطّلة لا تظهر للعملاء عند الطلب.</p>`;
 if(T==='coupons')body=`<div class="h1" style="margin-bottom:14px">الكوبونات</div><div class="tblw"><table class="tbl"><tr><th>الكود</th><th>الوصف</th><th>الاستخدام</th><th>مفعّل</th></tr>${G.coupons.map(c=>`<tr><td><b>${esc(c.code)}</b></td><td class="mu">${esc(c.label)} · حد أقصى ${fmt(c.max_off)} ${CUR}</td><td class="num">${c.used}</td><td><button class="switch ${c.active?'on':''}" data-con="${esc(c.code)}"></button></td></tr>`).join('')}</table></div>`;
 return shell('منصتك','لوحة الإدارة',[['dash','نظرة عامة',0],['orders','الطلبات',live.length],['rests','المطاعم والعمولات',0],['zones','مناطق التوصيل',0],['coupons','الكوبونات',0]],T,'data-atab',body);
}
async function admClick(e){
 const t=e.target.closest('button');if(!t)return;const d=t.dataset;
 if(d.logout!==undefined){await sb.auth.signOut();return}
 if(d.atab){ST.adminTab=d.atab;render();return}
 if(d.zon){const z=G.zones.find(x=>x.id===+d.zon);const {error}=await sb.from('dl_zones').update({active:!z.active}).eq('id',z.id);if(error)toast(errMsg(error),1);else{z.active=!z.active;render()}return}
 if(d.con){const c=G.coupons.find(x=>x.code===d.con);const {error}=await sb.from('dl_coupons').update({active:!c.active}).eq('code',c.code);if(error)toast(errMsg(error),1);else{c.active=!c.active;render()}return}
}
async function admChange(e){const d=e.target.dataset;const v=parseFloat(e.target.value);
 if(d.comm){if(!(v>=0&&v<=50)){toast('العمولة بين 0 و 50٪',1);render();return}const {error}=await sb.from('dl_restaurants').update({commission:v}).eq('id',d.comm);if(error)toast(errMsg(error),1);else{rest(d.comm).commission=v;toast('تم تحديث العمولة')}}
 if(d.zfee){if(!(v>=0&&v<=200)){toast('رسوم غير صالحة',1);render();return}const {error}=await sb.from('dl_zones').update({fee:v}).eq('id',+d.zfee);if(error)toast(errMsg(error),1);else{G.zones.find(z=>z.id===+d.zfee).fee=v;toast('تم تحديث الرسوم')}}}

/* ================= SHELL ================= */
function render(){
 const app=document.getElementById('app');const rl=role();
 const ae=document.activeElement;const fid=ae&&app.contains(ae)?ae.id:null;const fpos=fid&&ae.selectionStart!=null?ae.selectionStart:null;
 if(ae&&ae.dataset&&(ae.dataset.dotp!==undefined||ae.classList.contains('inp'))&&app.contains(ae))return; // don't clobber typing
 document.body.className=(rl==='customer'||rl==='driver')?'m':'';
 const html=rl==='restaurant'?renderRestaurant():rl==='driver'?renderDriver():rl==='admin'?renderAdmin():renderCustomer();
 const keep={};app.querySelectorAll('input[id]').forEach(i=>keep[i.id]=i.value);
 app.innerHTML=html;
 for(const id in keep){const el=document.getElementById(id);if(el&&!['q'].includes(id)&&el.type!=='password'&&!el.value)el.value=keep[id];if(el&&el.type==='password'&&keep[id])el.value=keep[id]}
 if(fid){const el=document.getElementById(fid);if(el){el.focus();try{if(fpos!=null)el.setSelectionRange(fpos,fpos)}catch(e){}}}
}
const app=document.getElementById('app');
app.addEventListener('click',e=>{const rl=role();(rl==='restaurant'?restClick:rl==='driver'?drvClick:rl==='admin'?admClick:custClick)(e)});
app.addEventListener('change',e=>{const rl=role();
 if(e.target.dataset.zone!==undefined){C.zone=+e.target.value;LS.set('zone',C.zone);render();return}
 if(rl==='restaurant')restChange(e);else if(rl==='admin')admChange(e)});
app.addEventListener('input',e=>{
 if(e.target.id==='q'){C.q=e.target.value.trim();render()}
 if(e.target.id==='caddr')C.addr=e.target.value;if(e.target.id==='dnote')C.note=e.target.value;if(e.target.id==='cpn')C.couponIn=e.target.value;
 if(e.target.dataset.dotp!==undefined){e.target.value=e.target.value.replace(/\D/g,'');const n=document.querySelector(`[data-dotp="${+e.target.dataset.dotp+1}"]`);if(e.target.value&&n)n.focus()}
});
app.addEventListener('submit',e=>{if(e.target.id==='authf')authSubmit(e)});

async function onSession(session){
 G.session=session;ST.known=new Set();ST.first=true;
 if(session){await loadProfile();await loadOrders();subscribe();
  if(C.screen==='auth'){C.screen=C.after==='checkout'&&cartCount()?'checkout':'home';C.hist=C.after==='checkout'?['home','cart']:[];C.after=null}
 } else {G.profile=null;G.orders=[];if(rtCh){sb.removeChannel(rtCh);rtCh=null}C.screen='home';C.hist=[];subscribe()}
 render();
}
(async()=>{
 try{await loadCatalog();G.loaded=true}catch(e){document.getElementById('app').innerHTML='<div class="empty">تعذّر الاتصال بالخادم<br><button class="btn p" style="margin:14px auto" onclick="location.reload()">أعد المحاولة</button></div>';return}
 if(C.cart.rid&&!G.rests.some(r=>r.id===C.cart.rid))C.cart={rid:null,lines:[]};
 const {data}=await sb.auth.getSession();await onSession(data.session);
 sb.auth.onAuthStateChange((ev,s)=>{if(ev==='SIGNED_IN'&&G.session?.user.id===s?.user.id)return;if(ev==='TOKEN_REFRESHED'){G.session=s;return}if(ev==='SIGNED_IN'||ev==='SIGNED_OUT')setTimeout(()=>onSession(s),0)});
})();
</script>
