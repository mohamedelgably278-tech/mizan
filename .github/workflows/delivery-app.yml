name: delivery-app-android
on:
  push:
    branches: [main]
    paths: ['delivery-app/**', '.github/workflows/delivery-app.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: delivery-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate platform folders
        run: |
          flutter create --org app.munassatak --project-name munassatak --platforms android,ios .
          rm -rf test
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' $M || sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' $M
          sed -i 's#android:label="[^"]*"#android:label="منصتك"#' $M
          sed -i 's#<string>Munassatak</string>#<string>منصتك</string>#' ios/Runner/Info.plist || true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - run: flutter build apk --release
      - name: Publish APK release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk munassatak.apk
          gh release delete delivery-app-latest --yes --cleanup-tag || true
          gh release create delivery-app-latest munassatak.apk --title "منصتك — تطبيق العميل (أندرويد)" --notes "نسخة تجريبية تلقائية من آخر تحديث" --prerelease
